<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b0b12"
  >

  <title>Login — YUSUF ANIME</title>

  <link
    rel="stylesheet"
    href="css/auth.css"
  >
</head>

<body>

  <main class="auth-page">

    <a
      href="index.html"
      class="auth-logo"
    >
      YUSUF<span>ANIME</span>
    </a>


    <div class="auth-card">

      <div class="auth-header">

        <div class="auth-icon">
          👤
        </div>

        <h1>
          Welcome Back
        </h1>

        <p>
          Login to continue your anime journey.
        </p>

      </div>


      <form
        id="loginForm"
        class="auth-form"
      >

        <div class="form-group">

          <label for="loginEmail">
            Email
          </label>

          <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="loginPassword">
            Password
          </label>

          <div class="password-field">

            <input
              id="loginPassword"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              data-target="loginPassword"
            >
              👁️
            </button>

          </div>

        </div>


        <div class="form-options">

          <label class="remember-me">

            <input
              type="checkbox"
              id="rememberMe"
            >

            <span>
              Remember me
            </span>

          </label>

          <a href="#">
            Forgot password?
          </a>

        </div>


        <button
          type="submit"
          class="auth-button"
        >
          Login
        </button>

      </form>


      <div
        id="loginMessage"
        class="auth-message"
      ></div>


      <div class="auth-divider">
        <span>OR</span>
      </div>


      <p class="auth-switch">

        Don't have an account?

        <a href="register.html">
          Create Account
        </a>

      </p>

    </div>


    <a
      href="index.html"
      class="back-home"
    >
      ← Back to YUSUF ANIME
    </a>

  </main>


  <script src="js/auth.js"></script>

</body>
</html>
